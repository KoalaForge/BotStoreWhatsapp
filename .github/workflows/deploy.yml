name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: koalaforge/koalastore.bot-wa
  DEPLOY_PATH: /root/botstore-wa

jobs:
  # ── Build Docker image & push to GHCR ────────────────────
  build:
    name: Build & Push Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=min

      - name: Discord — Build Notification
        if: always() && env.DISCORD_WEBHOOK != ''
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          BUILD_STATUS: ${{ steps.build.outcome }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
          ACTOR: ${{ github.actor }}
          BRANCH: ${{ github.ref_name }}
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          if [ "$BUILD_STATUS" == "success" ]; then
            COLOR=3447003
            TITLE="📦 WA Bot — Build Berhasil!"
            DESC="✅ Docker image berhasil di-build dan push ke GHCR!"
            STATUS="✅ Berhasil"
          else
            COLOR=15158332
            TITLE="💥 WA Bot — Build Gagal!"
            DESC="❌ Docker image gagal di-build! Deploy dibatalkan."
            STATUS="❌ Gagal"
          fi

          TAGS_DISPLAY=$(echo "$IMAGE_TAGS" | tr '\n' ',' | sed 's/,$//' | sed 's/,/, /g')

          PAYLOAD=$(jq -n \
            --arg title "$TITLE" \
            --arg desc "$DESC" \
            --argjson color "$COLOR" \
            --arg status "$STATUS" \
            --arg branch "$BRANCH" \
            --arg actor "$ACTOR" \
            --arg commit "${COMMIT_SHA:0:7}" \
            --arg commit_msg "$COMMIT_MESSAGE" \
            --arg commit_url "$COMMIT_URL" \
            --arg tags "$TAGS_DISPLAY" \
            --arg timestamp "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{
              embeds: [{
                title: $title,
                description: $desc,
                color: $color,
                fields: [
                  {name: "📊 Status", value: $status, inline: true},
                  {name: "🔀 Branch", value: ("`" + $branch + "`"), inline: true},
                  {name: "👤 Author", value: $actor, inline: true},
                  {name: "🏷️ Tags", value: ("`" + $tags + "`"), inline: false},
                  {name: "🔗 Commit", value: ("[`" + $commit + "`](" + $commit_url + ")"), inline: true},
                  {name: "💬 Message", value: $commit_msg, inline: true}
                ],
                footer: {text: "KOALASTORE.DIGI Deploy Bot 🐨"},
                timestamp: $timestamp
              }]
            }')

          curl -s -H "Content-Type: application/json" -d "$PAYLOAD" "$DISCORD_WEBHOOK"

  # ── Deploy via SSH ────────────────────────────────────────
  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: docker

      - name: Sync deploy files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "docker/docker-compose.yml,docker/docker-compose.redis.yml,docker/deploy.sh,docker/cleanup.sh"
          target: ${{ env.DEPLOY_PATH }}
          strip_components: 1

      - name: Deploy via SSH
        id: deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script_stop: true
          command_timeout: 5m
          envs: GHCR_TOKEN,DEPLOY_PATH
          script: |
            # Login to GHCR (read-only token recommended)
            echo "$GHCR_TOKEN" | docker login ghcr.io -u koalaforge --password-stdin

            cd "$DEPLOY_PATH"
            chmod +x ./deploy.sh ./cleanup.sh

            # Ensure redis stack is up (idempotent — no-op if unchanged)
            if [ -f docker-compose.redis.yml ]; then
              docker compose -f docker-compose.redis.yml up -d --remove-orphans
            fi

            # Rolling deploy of bot stack
            ./deploy.sh
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          DEPLOY_PATH: ${{ env.DEPLOY_PATH }}

      - name: Discord — Deploy Notification
        if: always() && env.DISCORD_WEBHOOK != ''
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DEPLOY_STATUS: ${{ steps.deploy.outcome }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
          ACTOR: ${{ github.actor }}
          BRANCH: ${{ github.ref_name }}
          DEPLOY_DIR: ${{ env.DEPLOY_PATH }}
        run: |
          if [ "$DEPLOY_STATUS" == "success" ]; then
            COLOR=3066993
            TITLE="🚀 WA Bot — Deploy Berhasil!"
            DESC="✅ Semua instance berhasil di-deploy via Docker!"
            STATUS="✅ Berhasil"
          else
            COLOR=15158332
            TITLE="💥 WA Bot — Deploy Gagal!"
            DESC="❌ Deploy gagal! Segera cek logs untuk detail error."
            STATUS="❌ Gagal"
          fi

          PAYLOAD=$(jq -n \
            --arg title "$TITLE" \
            --arg desc "$DESC" \
            --argjson color "$COLOR" \
            --arg status "$STATUS" \
            --arg path "$DEPLOY_DIR" \
            --arg branch "$BRANCH" \
            --arg actor "$ACTOR" \
            --arg commit "${COMMIT_SHA:0:7}" \
            --arg commit_msg "$COMMIT_MESSAGE" \
            --arg commit_url "$COMMIT_URL" \
            --arg timestamp "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{
              embeds: [{
                title: $title,
                description: $desc,
                color: $color,
                fields: [
                  {name: "📊 Status", value: $status, inline: true},
                  {name: "🔀 Branch", value: ("`" + $branch + "`"), inline: true},
                  {name: "👤 Author", value: $actor, inline: true},
                  {name: "📂 Path", value: ("`" + $path + "`"), inline: false},
                  {name: "🔗 Commit", value: ("[`" + $commit + "`](" + $commit_url + ")"), inline: true},
                  {name: "💬 Message", value: $commit_msg, inline: true}
                ],
                footer: {text: "KOALASTORE.DIGI Deploy Bot 🐨"},
                timestamp: $timestamp
              }]
            }')

          curl -s -H "Content-Type: application/json" -d "$PAYLOAD" "$DISCORD_WEBHOOK"
