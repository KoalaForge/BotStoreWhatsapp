# ============================================================
# KoalaStore WhatsApp Bot - Docker Compose
# ============================================================

x-wa-bot: &wa-bot-base
  image: ghcr.io/koalaforge/koalastore.bot-wa:${IMAGE_TAG:-latest}
  restart: always
  stop_grace_period: 15s
  networks:
    - proxy-network
    - backend
  dns:
    - 1.1.1.1
    - 8.8.8.8
  security_opt:
    - no-new-privileges:true
  # Cap container log disk usage (json-file default = unbounded growth)
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  # Ephemeral scratch space, capped and auto-cleared on restart
  tmpfs:
    - /tmp:size=64m,mode=1777
  volumes:
    - /etc/ssl/certs:/etc/ssl/certs:ro
    - /usr/share/ca-certificates:/usr/share/ca-certificates:ro

services:
  # ── Instance: wa-saas (MULTI mode) ──────────────────────
  wa-saas:
    <<: *wa-bot-base
    container_name: wa-saas
    env_file: ./instances/wa-saas/.env
    environment:
      - NODE_ENV=production
      - SHUTDOWN_TIMEOUT_MS=10000
      - API_PORT=3000
      - MONGODB_MAX_POOL_SIZE=50
      - PM2_MAX_MEMORY=512M
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f -s --max-time 5 http://localhost:$${API_PORT:-3000}/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  koalastoredigibot:
      <<: *wa-bot-base
      container_name: wa-master
      env_file: ./instances/wa-master/.env
      environment:
        - NODE_ENV=production
        - SHUTDOWN_TIMEOUT_MS=10000
        - API_PORT=3000
        - MONGODB_MAX_POOL_SIZE=50
        - PM2_MAX_MEMORY=512M
      healthcheck:
        test: ["CMD-SHELL", "curl -f -s --max-time 5 http://localhost:$${API_PORT:-3000}/ready || exit 1"]
        interval: 10s
        timeout: 5s
        retries: 3
        start_period: 30s
networks:
  proxy-network:
    external: true
  backend:
    external: true
